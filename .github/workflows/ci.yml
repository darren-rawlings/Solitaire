name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build game assembly
        run: dotnet build GameTemplate.csproj
      - name: Run rules tests
        run: dotnet test tests/GameTemplate.Tests
